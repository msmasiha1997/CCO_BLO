      problem:
        kind: high_dimension
        dim: 10
        samples_num: 100
        delta: 0.05
        initial_x: zeros
        max_iter_s: 50
        max_iter_x: 80
        theta: 0.1
        epsilon: 0.001
        lr: 0.01
        mu: 0.01
        mu_schedule: geom
        mu_final: 0.002
        inner_solver: bisect
        inner_tol: 1.0e-8
        grad_clip: 20.0
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 2

