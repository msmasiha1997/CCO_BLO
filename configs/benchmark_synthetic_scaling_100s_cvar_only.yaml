benchmark:
  run_name: synthetic_scaling_100s_cvar_only

  eval_samples: 5000

  # Not used (no solver-based baselines enabled) but kept for completeness.
  cpp_time_limit_s: 100
  kktbl_time_limit_s: 100

  methods:
    - CVaR

  cases:
