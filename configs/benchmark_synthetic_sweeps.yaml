benchmark:
  run_name: synthetic_sweeps

  # Empirical coverage estimation uses this many samples per run.
  eval_samples: 100000

  # Time limit in seconds for SCIP-based baselines (CPP-* and KKTBL).
  cpp_time_limit_s: 600
  kktbl_time_limit_s: 600

  methods:
    - Core
    - TACO
    - CPP-MIP
    - CPP-KKT
    - SA
    - SAA
    - KKTBL

  method_params:
    SAA:
      omega: null # defaults to delta if null

  cases:
    # =========================
    # CPP paper toy (univariate)
    # =========================
    - id: cpp1_m500_delta0p10
      problem:
        kind: cpp_problem
        samples_num: 500
        delta: 0.10
        initial_x: -4.0
        max_iter_s: 400
        max_iter_x: 300
        theta: 0.09
        epsilon: 0.01
        lr: 0.007
        mu: 0.005
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 50

    # =========================
    # Dimension scaling (fixed M, delta)
    # =========================
    - id: hd_d10_m100_delta0p05
      problem:
        kind: high_dimension
        dim: 10
        samples_num: 100
        delta: 0.05
        initial_x: zeros
        max_iter_s: 400
        max_iter_x: 500
        theta: 0.1
        epsilon: 0.001
        lr: 0.01
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 30

    - id: hd_d30_m100_delta0p05
      problem:
        kind: high_dimension
        dim: 30
        samples_num: 100
        delta: 0.05
        initial_x: zeros
        max_iter_s: 400
        max_iter_x: 500
        theta: 0.1
        epsilon: 0.001
        lr: 0.008
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 30

    - id: hd_d100_m100_delta0p05
      problem:
        kind: high_dimension
        dim: 100
        samples_num: 100
        delta: 0.05
        initial_x: zeros
        max_iter_s: 500
        max_iter_x: 700
        theta: 0.1
        epsilon: 0.001
        lr: 0.005
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 20

    # =========================
    # Sample scaling (fixed d, delta)
    # =========================
    - id: hd_d30_m250_delta0p05
      problem:
        kind: high_dimension
        dim: 30
        samples_num: 250
        delta: 0.05
        initial_x: zeros
        max_iter_s: 400
        max_iter_x: 600
        theta: 0.1
        epsilon: 0.001
        lr: 0.008
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 20

    - id: hd_d30_m500_delta0p05
      problem:
        kind: high_dimension
        dim: 30
        samples_num: 500
        delta: 0.05
        initial_x: zeros
        max_iter_s: 400
        max_iter_x: 600
        theta: 0.1
        epsilon: 0.001
        lr: 0.008
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 20

    # =========================
    # Safety level scaling (fixed d, M)
    # =========================
    - id: hd_d30_m100_delta0p01
      problem:
        kind: high_dimension
        dim: 30
        samples_num: 100
        delta: 0.01
        initial_x: zeros
        max_iter_s: 400
        max_iter_x: 600
        theta: 0.1
        epsilon: 0.001
        lr: 0.008
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 20

    - id: hd_d30_m100_delta0p10
      problem:
        kind: high_dimension
        dim: 30
        samples_num: 100
        delta: 0.10
        initial_x: zeros
        max_iter_s: 400
        max_iter_x: 600
        theta: 0.1
        epsilon: 0.001
        lr: 0.008
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 20

    # =========================
    # Heavy-tailed (univariate lognormal)
    # =========================
    - id: ht_m500_delta0p05
      problem:
        kind: heavy_tailed
        samples_num: 500
        delta: 0.05
        initial_x: 3.0
        max_iter_s: 400
        max_iter_x: 500
        theta: 0.1
        epsilon: 0.001
        lr: 0.01
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 30

    - id: ht_m3000_delta0p05
      problem:
        kind: heavy_tailed
        samples_num: 3000
        delta: 0.05
        initial_x: 3.0
        max_iter_s: 400
        max_iter_x: 500
        theta: 0.1
        epsilon: 0.001
        lr: 0.01
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 20
