benchmark:
  # Quick sanity-scale version of benchmark_synthetic_baselines.yaml
  # Intended to finish in a few minutes on a single GPU node.
  run_name: synthetic_baselines_quick

  # Empirical coverage estimation uses this many samples per run.
  eval_samples: 5000

  # Time limits (seconds) for solver-based baselines.
  cpp_time_limit_s: 10
  kktbl_time_limit_s: 10

  methods:
    - Core
    - TACO
    - CPP-MIP
    - CPP-KKT
    - SA
    - SAA
    - KKTBL

  method_params:
    SAA:
      omega: null

  cases:
    # Keep one CPPProblem case (as in the full baseline config) but with few seeds.
    - id: quick_example1_cpp_problem_m500_delta0p10
      problem:
        kind: cpp_problem
        samples_num: 500
        delta: 0.10
        initial_x: -4.0
        max_iter_s: 50
        max_iter_x: 80
        theta: 0.09
        epsilon: 0.01
        lr: 0.007
        mu: 0.005
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 2

    # And one small high-dimensional case.
    - id: quick_gaussian_linear_d10_m100_delta0p05
      problem:
        kind: high_dimension
        dim: 10
        samples_num: 100
        delta: 0.05
        initial_x: zeros
        max_iter_s: 50
        max_iter_x: 80
        theta: 0.1
        epsilon: 0.001
        lr: 0.01
        mu: 0.01
        abstol: 1.0e-5
      seeds:
        start: 0
        count: 2

