run_name: imagenet100_sanity_ccoblo
seed: 0

data:
  num_classes: 100
  image_size: 64
  batch_size: 8
  num_workers: 0

train:
  epochs: 1
  model_name: resnet18
  optimizer: sgd
  lr: 0.03
  momentum: 0.9
  weight_decay: 0.0001
  amp: false
  grad_clip_norm: 1.0
  max_train_batches: 1
  max_eval_batches: 1

method:
  name: ccoblo
  params:
    kappa: 0.0
    families: [noise, blur, weather, digital]
    delta: 0.1
    theta: 0.2
    eps: 0.005
    mu: 0.1
    inner_steps: 20
    alpha_max: 5.0
    denom_floor: 0.005
    proxy_scale: 0.2
    proxy_reduction: mean
    warmup_epochs: 1
    skip_nonfinite: true

corruptions:
  severity_min: 1
  severity_max: 3
