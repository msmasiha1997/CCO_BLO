run_name: imagenet100_core_ccoblo
seed: 0

data:
  num_classes: 100
  image_size: 224
  batch_size: 64
  num_workers: 4

train:
  epochs: 90
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  amp: false
  grad_clip_norm: 1.0

method:
  name: ccoblo
  params:
    kappa: 0.0
    families: [noise, blur, weather, digital]
    delta: 0.05
    theta: 0.2
    eps: 0.005
    mu: 0.1
    inner_steps: 60
    inner_solver: bisect
    alpha_max: 5.0
    denom_floor: 0.005
    proxy_scale: 0.2
    proxy_reduction: mean
    warmup_epochs: 10
    skip_nonfinite: true

corruptions:
  severity_min: 1
  severity_max: 5
