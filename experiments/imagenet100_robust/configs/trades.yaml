run_name: imagenet100_trades
seed: 0

data:
  num_classes: 100
  image_size: 224
  batch_size: 64
  num_workers: 4

train:
  epochs: 90
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  amp: false
  grad_clip_norm: 1.0

method:
  name: trades
  params:
    epsilon: 0.0078
    step_size: 0.001
    steps: 5
    beta: 3.0
    skip_nonfinite: true

corruptions:
  severity_min: 1
  severity_max: 5
